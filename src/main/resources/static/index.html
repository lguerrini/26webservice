<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <title>Archivio IoT</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #202922;
            --muted: #68756c;
            --line: #dce3dc;
            --paper: #ffffff;
            --canvas: #f6f7f3;
            --green: #235f49;
            --green-soft: #e6f0e8;
            --orange: #bd542e;
            --error: #a43232;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background:
                linear-gradient(135deg, transparent 0 70%, rgba(220, 227, 220, .34) 70% 70.2%, transparent 70.2%),
                var(--canvas);
            font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 58px;
            padding: 0 clamp(20px, 5vw, 72px);
            color: #f7fbf7;
            background: var(--green);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .brand-mark {
            display: grid;
            width: 26px;
            height: 26px;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, .55);
            border-radius: 50%;
            color: #d5efc8;
            font-size: 12px;
        }

        .topbar-label {
            color: #d5e6da;
            font-size: 12px;
        }

        main {
            width: min(100% - 40px, 980px);
            margin: 0 auto;
            padding: clamp(38px, 7vh, 76px) 0 64px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--orange);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(30px, 5vw, 42px);
            line-height: 1.1;
        }

        .intro {
            margin: 12px 0 32px;
            color: var(--muted);
            font-size: 15px;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: end;
            gap: 10px;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--paper);
        }

        .filter {
            display: grid;
            gap: 6px;
            min-width: min(100%, 230px);
            margin-right: auto;
        }

        label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        input, textarea, button { font: inherit; }

        input, textarea {
            width: 100%;
            min-height: 38px;
            padding: 8px 10px;
            border: 1px solid #bdc9bf;
            border-radius: 4px;
            color: var(--ink);
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        input:focus-visible, textarea:focus-visible, button:focus-visible {
            outline: 3px solid #e5a27f;
            outline-offset: 2px;
        }

        button {
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid var(--green);
            border-radius: 4px;
            color: #fff;
            background: var(--green);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            color: var(--green);
            background: #fff;
        }

        button.danger {
            border-color: var(--error);
            background: var(--error);
        }

        button.small {
            min-height: 30px;
            padding: 0 10px;
            font-size: 12px;
        }

        button:hover { filter: brightness(.94); }
        button:disabled { cursor: wait; opacity: .65; }

        .panel {
            margin-bottom: 28px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: rgba(255, 255, 255, .72);
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .panel-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px 16px;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field-wide {
            grid-column: 1 / -1;
        }

        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .iot-card {
            display: grid;
            gap: 12px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-left: 3px solid var(--orange);
            border-radius: 6px;
            background: var(--paper);
            animation: appear .24s ease-out both;
        }

        .iot-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .iot-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .iot-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            padding: 4px 8px;
            border-radius: 999px;
            color: var(--green);
            background: var(--green-soft);
            font-size: 11px;
            font-weight: 800;
        }

        .iot-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .iot-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            background: var(--green-soft);
        }

        .iot-meta div {
            display: grid;
            gap: 4px;
        }

        .iot-meta span {
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .iot-description {
            margin: 0;
            color: var(--ink);
            font-size: 14px;
            line-height: 1.5;
        }

        .iot-json {
            margin: 0;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 4px;
            background: #f8faf8;
        }

        .list-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            margin: 30px 0 10px;
        }

        h2 {
            margin: 0;
            font-size: 17px;
        }

        #summary {
            color: var(--muted);
            font-size: 12px;
        }

        ul {
            display: grid;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .record {
            display: grid;
            grid-template-columns: minmax(105px, .65fr) minmax(0, 2fr);
            gap: 14px 24px;
            padding: 17px 19px;
            border: 1px solid var(--line);
            border-left: 3px solid var(--green);
            border-radius: 4px;
            background: var(--paper);
            animation: appear .24s ease-out both;
        }

        .record-meta {
            display: grid;
            align-content: start;
            gap: 6px;
        }

        .record-id {
            color: var(--green);
            font-size: 14px;
            font-weight: 800;
        }

        .record-date {
            color: var(--muted);
            font-size: 11px;
            line-height: 1.5;
        }

        .record-body { min-width: 0; }

        .iot-id {
            margin: 0 0 8px;
            color: var(--orange);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }
        #iots {
            background: rgba(185, 149, 71, 0.7);
        }
        pre {
            overflow: auto;
            margin: 0;
            color: #34433a;
            font-family: Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message {
            padding: 24px 18px;
            border: 1px dashed #bdc9bf;
            border-radius: 4px;
            color: var(--muted);
            background: rgba(255, 255, 255, .7);
            font-size: 14px;
        }

        .message.error { color: var(--error); }

        @keyframes appear {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 580px) {
            .topbar { min-height: 52px; }
            .topbar-label { font-size: 11px; }
            main { width: min(100% - 28px, 980px); }
            .toolbar { align-items: stretch; }
            .filter { width: 100%; }
            .toolbar button { flex: 1; }
            .record { grid-template-columns: 1fr; gap: 12px; }
            .record-meta { grid-template-columns: auto 1fr; align-items: center; }
            .record-date { text-align: right; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">I</span> IoT / DATA</div>
        <span class="topbar-label">Archivio dispositivi e letture DB iot26</span>
    </header>

    <main>
        <p class="eyebrow">Registro dispositivi</p>
        <h1>IoT & letture</h1>
        <p class="intro">Elenco dei dispositivi con i relativi parametri e possibilità di aggiornare i record.</p>

        <section class="panel">
            <div class="panel-header">
                <h2>Dispositivi IoT</h2>
                <div class="panel-actions">
                    <button class="secondary" id="new-iot" type="button">Nuovo</button>
                    <button id="refresh-iots" type="button">Aggiorna</button>
                </div>
            </div>
            <ul id="iots" aria-live="polite" aria-busy="true"></ul>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2 id="iot-form-title">Modifica dispositivo</h2>
            </div>
            <form id="iot-form">
                <input type="hidden" id="iot-id-edit" />
                <div class="form-grid">
                    <div class="field">
                        <label for="iot-name">Nome</label>
                        <input id="iot-name" name="name" type="text" maxlength="45" required>
                    </div>
                    <div class="field">
                        <label for="iot-macaddress">MAC Address</label>
                        <input id="iot-macaddress" name="macaddress" type="text" maxlength="45" required>
                    </div>
                    <div class="field field-wide">
                        <label for="iot-description">Descrizione</label>
                        <input id="iot-description" name="description" type="text" maxlength="245">
                    </div>
                    <div class="field field-wide">
                        <label for="iot-jsonrange">Json range</label>
                        <textarea id="iot-jsonrange" name="jsonrange" rows="4" maxlength="512"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="save-iot">Salva modifiche</button>
                    <button type="button" class="secondary" id="cancel-edit">Annulla</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <form class="toolbar" id="filter-form">
                <div class="filter">
                    <label for="iot-id">Filtra per ID dispositivo</label>
                    <input id="iot-id" name="iotId" type="number" min="1" step="1" placeholder="Tutti i dispositivi">
                </div>
                <button type="submit">Filtra</button>
                <button class="secondary" id="all-records" type="button">Mostra tutti</button>
                <button class="secondary" id="refresh" type="button" aria-label="Aggiorna elenco">Aggiorna</button>
            </form>

            <div class="list-heading">
                <h2>Letture</h2>
                <span id="summary" aria-live="polite">Caricamento...</span>
            </div>
            <ul id="records" aria-live="polite" aria-busy="true"></ul>
        </section>
    </main>

    <script>
        const form = document.querySelector('#filter-form');
        const iotIdInput = document.querySelector('#iot-id');
        const recordsList = document.querySelector('#records');
        const summary = document.querySelector('#summary');
        const refreshButton = document.querySelector('#refresh');
        const iotList = document.querySelector('#iots');
        const iotForm = document.querySelector('#iot-form');
        const iotIdEdit = document.querySelector('#iot-id-edit');
        const iotNameInput = document.querySelector('#iot-name');
        const iotMacInput = document.querySelector('#iot-macaddress');
        const iotDescriptionInput = document.querySelector('#iot-description');
        const iotJsonRangeInput = document.querySelector('#iot-jsonrange');
        const iotFormTitle = document.querySelector('#iot-form-title');

        function showMessage(listElement, message, isError = false) {
            const item = document.createElement('li');
            item.className = isError ? 'message error' : 'message';
            item.textContent = message;
            listElement.replaceChildren(item);
        }

        function resetIotForm() {
            iotForm.reset();
            iotIdEdit.value = '';
            iotFormTitle.textContent = 'Modifica dispositivo';
            document.querySelector('#save-iot').textContent = 'Salva modifiche';
        }

        function renderIotCard(item) {
            const card = document.createElement('li');
            card.className = 'iot-card';

            const head = document.createElement('div');
            head.className = 'iot-header';
            const title = document.createElement('div');
            title.className = 'iot-title';
            title.innerHTML = `<span class="iot-badge">#${item.id ?? '?'}</span><strong>${item.name ?? 'Senza nome'}</strong>`;
            const actions = document.createElement('div');
            actions.className = 'iot-actions';
            const editButton = document.createElement('button');
            editButton.type = 'button';
            editButton.className = 'secondary small';
            editButton.textContent = 'Modifica';
            editButton.dataset.action = 'edit';
            editButton.dataset.id = item.id;
            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.className = 'danger small';
            deleteButton.textContent = 'Elimina';
            deleteButton.dataset.action = 'delete';
            deleteButton.dataset.id = item.id;
            actions.append(editButton, deleteButton);
            head.append(title, actions);

            const meta = document.createElement('div');
            meta.className = 'iot-meta';
            meta.innerHTML = `
                <div><span>MAC</span><strong>${item.macaddress ?? 'N/D'}</strong></div>
                <div><span>Data rev.</span><strong>${item.daterev ? String(item.daterev).replace('T', ' ') : 'N/D'}</strong></div>
            `;

            const description = document.createElement('p');
            description.className = 'iot-description';
            description.textContent = item.description || 'Nessuna descrizione';
            const jsonRange = document.createElement('pre');
            jsonRange.className = 'iot-json';
            jsonRange.textContent = item.jsonrange || 'Nessun json range';

            card.append(head, meta, description, jsonRange);
            return card;
        }

        async function loadIots() {
            iotList.setAttribute('aria-busy', 'true');
            try {
                const response = await fetch('/api/iots', { headers: { Accept: 'application/json' } });
                if (!response.ok) throw new Error(`Errore ${response.status}`);
                const items = await response.json();
                iotList.replaceChildren();
                if (!Array.isArray(items) || items.length === 0) {
                    showMessage(iotList, 'Nessun dispositivo trovato.');
                    return;
                }
                items.forEach(item => iotList.append(renderIotCard(item)));
            } catch (error) {
                showMessage(iotList, `Impossibile caricare i dispositivi. ${error.message}`, true);
            } finally {
                iotList.setAttribute('aria-busy', 'false');
            }
        }

        async function saveIot(event) {
            event.preventDefault();
            const id = iotIdEdit.value;
            const payload = {
                name: iotNameInput.value.trim(),
                description: iotDescriptionInput.value.trim(),
                macaddress: iotMacInput.value.trim(),
                jsonrange: iotJsonRangeInput.value.trim()
            };

            if (!payload.name || !payload.macaddress) {
                alert('Nome e MAC address sono obbligatori.');
                return;
            }

            try {
                const response = await fetch(id ? `/api/iots/${id}` : '/api/iots', {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const message = await response.text();
                    throw new Error(message || `Errore ${response.status}`);
                }

                resetIotForm();
                await loadIots();
            } catch (error) {
                alert(`Salvataggio non riuscito: ${error.message}`);
            }
        }

        iotForm.addEventListener('submit', saveIot);
        document.querySelector('#new-iot').addEventListener('click', resetIotForm);
        document.querySelector('#cancel-edit').addEventListener('click', resetIotForm);
        document.querySelector('#refresh-iots').addEventListener('click', loadIots);

        iotList.addEventListener('click', async (event) => {
            const button = event.target.closest('button[data-action]');
            if (!button) return;
            const id = Number(button.dataset.id);
            const action = button.dataset.action;

            if (action === 'edit') {
                try {
                    const response = await fetch(`/api/iots/${id}`, { headers: { Accept: 'application/json' } });
                    if (!response.ok) throw new Error(`Errore ${response.status}`);
                    const item = await response.json();
                    iotIdEdit.value = item.id;
                    iotNameInput.value = item.name || '';
                    iotMacInput.value = item.macaddress || '';
                    iotDescriptionInput.value = item.description || '';
                    iotJsonRangeInput.value = item.jsonrange || '';
                    iotFormTitle.textContent = `Modifica dispositivo #${item.id}`;
                    document.querySelector('#save-iot').textContent = 'Aggiorna';
                    iotNameInput.focus();
                } catch (error) {
                    alert(`Impossibile leggere il dispositivo: ${error.message}`);
                }
                return;
            }

            if (action === 'delete') {
                if (!window.confirm('Eliminare questo dispositivo?')) return;
                try {
                    const response = await fetch(`/api/iots/${id}`, { method: 'DELETE' });
                    if (!response.ok) throw new Error(`Errore ${response.status}`);
                    resetIotForm();
                    await loadIots();
                } catch (error) {
                    alert(`Eliminazione non riuscita: ${error.message}`);
                }
            }
        });

        function addRecord(record, index) {
            const item = document.createElement('li');
            item.className = 'record';
            item.style.animationDelay = `${Math.min(index * 25, 250)}ms`;

            const meta = document.createElement('div');
            meta.className = 'record-meta';
            const recordId = document.createElement('span');
            recordId.className = 'record-id';
            recordId.textContent = `#${record.id ?? '?'}`;
            const date = document.createElement('time');
            date.className = 'record-date';
            date.textContent = record.datetime ? String(record.datetime).replace('T', ' ') : 'Data non disponibile';
            meta.append(recordId, date);

            const body = document.createElement('div');
            body.className = 'record-body';
            const iotId = document.createElement('p');
            iotId.className = 'iot-id';
            iotId.textContent = `Dispositivo ${record.idIot ?? '?'}`;
            const data = document.createElement('pre');
            data.textContent = record.jsondata ?? 'Nessun dato';
            body.append(iotId, data);

            item.append(meta, body);
            recordsList.append(item);
        }

        async function loadRecords(iotId = '') {
            recordsList.setAttribute('aria-busy', 'true');
            refreshButton.disabled = true;
            summary.textContent = 'Caricamento...';
            showMessage(recordsList, 'Recupero dei record in corso...');

            const query = iotId ? `?iotId=${encodeURIComponent(iotId)}` : '';
            try {
                const response = await fetch(`/api/data${query}`, {
                    headers: { Accept: 'application/json' }
                });
                if (!response.ok) {
                    throw new Error(response.status === 404
                        ? 'Dispositivo non trovato.'
                        : `Risposta del server: ${response.status}`);
                }

                const records = await response.json();
                if (!Array.isArray(records)) {
                    throw new Error('La risposta del server non contiene un elenco di record.');
                }

                recordsList.replaceChildren();
                if (records.length === 0) {
                    showMessage(recordsList, 'Nessun record trovato.');
                } else {
                    records.forEach(addRecord);
                }
                summary.textContent = `${records.length} ${records.length === 1 ? 'record' : 'record'}`;
            } catch (error) {
                showMessage(recordsList, `Impossibile caricare i record. ${error.message}`, true);
                summary.textContent = 'Errore';
            } finally {
                recordsList.setAttribute('aria-busy', 'false');
                refreshButton.disabled = false;
            }
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            loadRecords(iotIdInput.value.trim());
        });

        document.querySelector('#all-records').addEventListener('click', () => {
            iotIdInput.value = '';
            loadRecords();
        });

        refreshButton.addEventListener('click', () => loadRecords(iotIdInput.value.trim()));
        resetIotForm();
        loadIots();
        loadRecords();
    </script>
</body>
</html>
