<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f3">
    <title>Utenti | IoT / DATA</title>
    <link rel="stylesheet" href="/css/users.css">
    <script src="/js/users.js" defer></script>
</head>
<body>
    <header class="topbar">
        <a class="brand" href="/index.html">
            <span class="brand-mark" aria-hidden="true">I</span> IoT / DATA
        </a>
        <div class="topbar-account">
            <span id="current-user"></span>
            <button class="secondary" id="logout" type="button">Esci</button>
        </div>
    </header>

    <main>
        <div class="page-heading">
            <div>
                <p class="eyebrow">Amministrazione</p>
                <h1>Utenti</h1>
                <p class="intro">Gestione degli account registrati.</p>
            </div>
            <button id="new-user" type="button">Nuovo utente</button>
        </div>

        <section class="panel" id="editor" hidden>
            <div class="panel-header">
                <h2 id="form-title">Nuovo utente</h2>
            </div>
            <form id="user-form">
                <input id="user-id" type="hidden">
                <div class="form-grid">
                    <div class="field">
                        <label for="firstname">Nome</label>
                        <input id="firstname" name="firstname" type="text" maxlength="45" required>
                    </div>
                    <div class="field">
                        <label for="lastname">Cognome</label>
                        <input id="lastname" name="lastname" type="text" maxlength="45" required>
                    </div>
                    <div class="field">
                        <label for="username">Username</label>
                        <input id="username" name="username" type="text" maxlength="45" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" maxlength="45">
                    </div>
                    <div class="field">
                        <label for="role">Ruolo</label>
                        <select id="role" name="role" required>
                            <option value="readonly">Readonly</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="t-usercol">Campo aggiuntivo</label>
                        <input id="t-usercol" name="tUsercol" type="text" maxlength="45">
                    </div>
                    <div class="field field-wide">
                        <label for="password">Password <span id="password-hint">obbligatoria per un nuovo utente</span></label>
                        <input id="password" name="password" type="password" minlength="8" maxlength="45" autocomplete="new-password">
                    </div>
                </div>
                <div class="form-actions">
                    <button id="save-user" type="submit">Crea utente</button>
                    <button class="secondary" id="cancel-edit" type="button">Annulla</button>
                </div>
                <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="user-section" aria-labelledby="list-title">
            <div class="list-heading">
                <h2 id="list-title">Account</h2>
                <span id="user-count" aria-live="polite">Caricamento...</span>
            </div>
            <ul id="user-list" aria-live="polite" aria-busy="true"></ul>
        </section>
    </main>
</body>
</html>
